name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            asm: gcc
          - compiler: clang
            cc: clang
            cxx: clang++
            asm: clang
    name: ${{ matrix.compiler }}
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-openxr-sdk
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_ASM_COMPILER=${{ matrix.asm }}
          -DNIERVR_DLSS=OFF
          -DCMAKE_INSTALL_PREFIX="$PWD/dist"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          cmake --install build
          cp LICENSE FONT-LICENSE.txt README.md dist/
          cd dist && 7z a ../NieRVR-${{ github.ref_name }}.zip *

      - uses: actions/upload-artifact@v4
        with:
          name: NieRVR-${{ matrix.compiler }}-${{ github.sha }}
          path: |
            dist/
            build/d3d11.map

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.compiler == 'gcc'
        uses: softprops/action-gh-release@v2
        with:
          files: NieRVR-${{ github.ref_name }}.zip
          generate_release_notes: true
